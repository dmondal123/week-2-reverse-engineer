[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-compare"
version = "0.1.0"
description = "LlamaIndex vs Haystack investigation: shared contracts, tracing, and immutable release mechanism"
requires-python = ">=3.12"
dependencies = [
    # Direct imports of the shared (framework-independent) layer:
    "tiktoken>=0.7",       # cl100k_base token-window splitter (adapters/base.py)
    "requests>=2.31",      # Ollama HTTP client (ollama.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
frameworks = [
    # Pinned framework cores are installed editable from ../../llama_index and
    # ../../haystack (see config/repository-manifest.json). These are the extra
    # retrieval integrations required by both adapters (Task 5), pinned to
    # the versions installed in .venv.
    "llama-index-retrievers-bm25==0.7.1",
    "rank_bm25==0.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
